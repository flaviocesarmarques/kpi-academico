# Entrada HTTP via Traefik (ingress padrão do k3s). O host é definido nos overlays.
# Em produção: TLS com cert-manager + Let's Encrypt e cabeçalhos de segurança
# (HSTS, X-Content-Type-Options) num Middleware do Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kpi-api
spec:
  ingressClassName: traefik
  rules:
    - host: kpi.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kpi-api
                port:
                  name: http
