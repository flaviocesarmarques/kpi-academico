# =============================================================================
# PostgreSQL no cluster — ADEQUADO PARA LABORATÓRIO.
# -----------------------------------------------------------------------------
# Em produção prefira: banco gerenciado da nuvem, ou o operador CloudNativePG
# (alta disponibilidade, backup contínuo e PITR). Banco com dado institucional
# exige backup testado — "backup que nunca foi restaurado não é backup".
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kpi-db
spec:
  clusterIP: None # headless: endereço estável para o StatefulSet
  selector:
    app.kubernetes.io/name: kpi-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kpi-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: kpi-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kpi-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kpi-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # usuário "postgres" da imagem alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kpi
            - name: POSTGRES_USER
              value: kpi
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kpi-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kpi", "-d", "kpi"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kpi", "-d", "kpi"]
            periodSeconds: 15
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
