# =============================================================================
# Job de migração do banco (Alembic) — roda ANTES da nova versão da API.
# -----------------------------------------------------------------------------
# "hook: Sync" + "sync-wave: 1": o Argo CD executa este Job depois do
# PostgreSQL (wave 0) e só então atualiza a API (wave 2). Se a migração
# falhar, o deploy PARA e a versão antiga continua no ar.
# Usa a MESMA imagem da API: código e migrações sempre na mesma versão.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: kpi-migracao
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6 # tentativas: cobre o tempo do banco ficar pronto
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kpi-migracao
        kpi.acesso-db: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migracao
          image: kpi-academico
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: kpi-config
            - secretRef:
                name: kpi-secrets
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
