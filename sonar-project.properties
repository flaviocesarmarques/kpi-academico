# =============================================================================
# SonarQube Cloud / SonarQube Community Build — análise de qualidade
# -----------------------------------------------------------------------------
# 1. Entre em https://sonarcloud.io com a conta GitHub e importe o repositório.
# 2. DESATIVE "Automatic Analysis" (a análise vem do CI, com cobertura).
# 3. Crie o segredo SONAR_TOKEN no repositório (Settings → Secrets → Actions).
# 4. Ajuste organization/projectKey abaixo (o script configurar-repo.sh faz isso).
# Quality Gate recomendado ("Sonar way"): foco no CÓDIGO NOVO — o legado
# melhora aos poucos, mas nada novo entra pior ("clean as you code").
# =============================================================================
sonar.organization=flaviocesarmarques
sonar.projectKey=flaviocesarmarques_kpi-academico
sonar.projectName=KPI Acadêmico
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
