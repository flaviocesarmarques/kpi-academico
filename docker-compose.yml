# =============================================================================
# docker-compose — ambiente LOCAL completo em um comando:   docker compose up --build
# -----------------------------------------------------------------------------
# Paridade dev/prod (12-Factor, fator X): mesmo PostgreSQL, mesma imagem e
# mesmo fluxo "migrar → subir app" usado no Kubernetes.
#
#   API ......... http://localhost:8000/docs
#   Unleash ..... http://localhost:4242  (perfil "flags": docker compose --profile flags up)
#
# Também é usado pelo workflow de DAST/performance (OWASP ZAP + k6) no CI.
# =============================================================================
name: kpi-academico

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kpi
      POSTGRES_USER: kpi
      # Valor de DESENVOLVIMENTO. Sobrescreva via .env; nunca use em produção.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpi-dev}
    volumes:
      - dados-db:/var/lib/postgresql/data
      # Scripts executados só na PRIMEIRA inicialização (cria o banco do Unleash).
      - ./scripts/compose/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi"]
      interval: 5s
      retries: 10

  # Migrações rodam ANTES da app e terminam (padrão "job de migração").
  migrate:
    build: .
    image: kpi-academico:local
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      KPI_DATABASE_URL: postgresql+psycopg://kpi:${POSTGRES_PASSWORD:-kpi-dev}@db:5432/kpi
      KPI_API_KEY: ${KPI_API_KEY:-troque-esta-chave}
      KPI_FLAG_PAINEL_TENDENCIA: ${KPI_FLAG_PAINEL_TENDENCIA:-false}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: kpi-academico:local
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true          # sistema de arquivos somente leitura
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]          # remove todas as capabilities do Linux

  # Popula dados de exemplo (opcional): docker compose run --rm seed
  seed:
    image: kpi-academico:local
    command: ["kpi-seed"]
    environment: *app-env
    profiles: [seed]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Servidor de feature flags (etapa 8). Painel: admin / unleash4all (troque!).
  unleash:
    image: unleashorg/unleash-server:7
    profiles: [flags]
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgres://kpi:${POSTGRES_PASSWORD:-kpi-dev}@db:5432/unleash
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-db:
