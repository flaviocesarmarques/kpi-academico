# =============================================================================
# Alembic — migrações de banco como código ("schema as code")
# -----------------------------------------------------------------------------
# Boas práticas:
#   • Cada mudança no schema = um arquivo versionado em migrations/versions,
#     revisado em Pull Request como qualquer outro código.
#   • Migrações rodam ANTES da nova versão da aplicação (Job "migrate" no
#     Kubernetes / serviço "migrate" no docker-compose) e devem ser
#     compatíveis com a versão anterior ("expand → migrate → contract"),
#     permitindo rollback da aplicação sem perder dados.
#   • A URL do banco NÃO fica aqui: vem de KPI_DATABASE_URL (ver migrations/env.py).
#
# Comandos úteis:
#   uv run alembic upgrade head                      # aplica todas as migrações
#   uv run alembic revision --autogenerate -m "msg"  # gera nova migração
#   uv run alembic downgrade -1                      # desfaz a última
# =============================================================================
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
