# Loki em modo monolítico (SingleBinary) com armazenamento em disco local —
# ideal para laboratório. Em produção: modo "SimpleScalable" com objeto (S3/MinIO).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h # 7 dias
singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
# Componentes do modo distribuído desligados
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
