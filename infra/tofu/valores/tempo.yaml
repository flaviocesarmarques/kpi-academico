# Tempo (modo single binary) — recebe traces via OTLP.
# A API envia para http://tempo.observabilidade:4318 (variável OTEL_EXPORTER_OTLP_ENDPOINT).
tempo:
  retention: 72h
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"
  metricsGenerator:
    enabled: true # gera métricas RED a partir dos traces (mapa de serviços no Grafana)
    remoteWriteUrl: http://kps-prometheus.observabilidade:9090/api/v1/write
persistence:
  enabled: true
  size: 5Gi
