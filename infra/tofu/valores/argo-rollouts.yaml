# Argo Rollouts — entrega progressiva (canary / blue-green).
# O dashboard permite acompanhar o canary passo a passo:
#   kubectl -n argo-rollouts port-forward svc/argo-rollouts-dashboard 3100:3100
dashboard:
  enabled: true
controller:
  metrics:
    enabled: true
    # O ServiceMonitor é um recurso do Prometheus Operator (CRD instalada pelo
    # kube-prometheus-stack). Sem a observabilidade, a CRD não existe e o Helm
    # falharia com "no matches for kind ServiceMonitor". Por isso é condicional.
    serviceMonitor:
      enabled: ${monitorar}
