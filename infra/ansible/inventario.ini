# Inventário Ansible — quais máquinas serão configuradas.
# Para um laboratório inteiro, liste as máquinas (e use chaves SSH, nunca senhas):
#   [estacoes]
#   lab-ti-01 ansible_host=10.0.10.11 ansible_user=aluno
#   lab-ti-02 ansible_host=10.0.10.12 ansible_user=aluno
[estacoes]
localhost ansible_connection=local

[estacoes:vars]
# Python do SISTEMA: o módulo apt depende do python3-apt, que só existe nele
# (sem isto, o Ansible pode escolher o Python do uv, que não tem esse módulo).
ansible_python_interpreter=/usr/bin/python3
