# =============================================================================
# Ansible — prepara a ESTAÇÃO DevOps (etapa 6: gerência de configuração)
# -----------------------------------------------------------------------------
# Instala, com versões FIXAS, todas as ferramentas da trilha numa máquina
# Ubuntu/Debian (notebook, VM de laboratório ou WSL2).
#
# Por que Ansible e não um script .sh?
#   • IDEMPOTENTE: rodar 10 vezes dá o mesmo resultado que rodar 1 vez.
#   • DECLARATIVO: descreve o estado desejado, não os passos.
#   • Modo simulação:  ansible-playbook ... --check --diff
#   • Escala: o mesmo playbook prepara 40 máquinas de um laboratório,
#     trocando só o inventário (inventario.ini).
#
# Uso recomendado:   make estacao
#   (detecta o sudo-rs do Ubuntu 25.10+ e pede a senha do usuário do Ubuntu)
# Manual:
#   uvx --from ansible-core ansible-playbook -i infra/ansible/inventario.ini \
#       infra/ansible/estacao-devops.yml -K -e ansible_become_exe=sudo.ws
#
# Customização: altere as versões em `vars` (o Dependabot não as acompanha;
# revise-as a cada semestre).
# =============================================================================
- name: Preparar estação DevOps
  hosts: estacoes
  become: true
  vars:
    arquitetura: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    usuario_dev: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    em_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | lower) }}"
    versoes:
      kubectl: v1.35.9 # mesma minor do k3s em infra/k3d/cluster.yaml
      k3d: v5.9.0
      helm: v3.22.0
      opentofu: 1.13.1
      sops: v3.13.3
      age: v1.3.2
      k6: v2.3.0
      argocd: v3.5.5
      cosign: v3.1.3
      argo_rollouts: v1.10.1
    destino_binarios: /usr/local/bin

  tasks:
    - name: Pacotes base
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, jq, make, unzip, gnupg, openssl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # GitHub CLI pelo repositório OFICIAL: o pacote "gh" do Ubuntu fica várias
    # versões atrás (ex.: sem "gh attestation verify", usado na etapa 5).
    # Ferramenta que evolui rápido → fonte do fornecedor, não da distribuição.
    - name: Diretório de chaves do apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Chave do repositório oficial do GitHub CLI
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"

    - name: Repositório oficial do GitHub CLI
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ arquitetura }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
          https://cli.github.com/packages stable main
        filename: github-cli
        state: present

    # "latest" (e não "present") de propósito: substitui um gh antigo do Ubuntu
    # que já esteja instalado. O gh não tem versão fixa aqui porque é só cliente.
    - name: GitHub CLI atualizado
      ansible.builtin.apt:
        name: gh
        state: latest # noqa: package-latest
        update_cache: true

    # No WSL (Windows), o Docker vem do Docker Desktop pela integração WSL:
    # instalar o docker.io dentro do Ubuntu cria dois Dockers concorrentes
    # ("Failed to start docker.service"). Por isso, no WSL, nunca instalamos.
    - name: Verificar se o Docker já está disponível
      ansible.builtin.command: docker --version
      register: docker_existente
      changed_when: false
      failed_when: false

    - name: Docker Engine (pacote da distribuição) — só em Linux nativo, sem Docker
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
      when:
        - docker_existente.rc != 0
        - not em_wsl

    - name: Usuário no grupo docker (requer novo login para valer)
      ansible.builtin.user:
        name: "{{ usuario_dev }}"
        groups: docker
        append: true
      when:
        - docker_existente.rc != 0
        - not em_wsl

    - name: Aviso — no WSL, ative a integração do Docker Desktop
      ansible.builtin.debug:
        msg: >-
          Docker não encontrado no Ubuntu. Abra o Docker Desktop no Windows e ative
          Settings > Resources > WSL integration > Ubuntu; depois rode "wsl --shutdown".
      when:
        - docker_existente.rc != 0
        - em_wsl

    - name: Binários únicos (download com versão fixa)
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ destino_binarios }}/{{ item.nome }}"
        mode: "0755"
      loop:
        - nome: kubectl
          url: "https://dl.k8s.io/release/{{ versoes.kubectl }}/bin/linux/{{ arquitetura }}/kubectl"
        - nome: k3d
          url: "https://github.com/k3d-io/k3d/releases/download/{{ versoes.k3d }}/k3d-linux-{{ arquitetura }}"
        - nome: sops
          url: "https://github.com/getsops/sops/releases/download/{{ versoes.sops }}/sops-{{ versoes.sops }}.linux.{{ arquitetura }}"
        - nome: argocd
          url: "https://github.com/argoproj/argo-cd/releases/download/{{ versoes.argocd }}/argocd-linux-{{ arquitetura }}"
        - nome: cosign
          url: "https://github.com/sigstore/cosign/releases/download/{{ versoes.cosign }}/cosign-linux-{{ arquitetura }}"
        # Plugin do kubectl: "kubectl argo rollouts get/promote/abort" (etapa 8)
        - nome: kubectl-argo-rollouts
          url: "https://github.com/argoproj/argo-rollouts/releases/download/{{ versoes.argo_rollouts }}/kubectl-argo-rollouts-linux-{{ arquitetura }}"
      loop_control:
        label: "{{ item.nome }}"

    - name: Diretório temporário para pacotes compactados
      ansible.builtin.file:
        path: /tmp/estacao-devops
        state: directory
        mode: "0755"

    - name: Ferramentas distribuídas em .tar.gz
      ansible.builtin.unarchive:
        src: "{{ item.url }}"
        dest: /tmp/estacao-devops
        remote_src: true
        creates: "/tmp/estacao-devops/{{ item.marcador }}"
      loop:
        - url: "https://get.helm.sh/helm-{{ versoes.helm }}-linux-{{ arquitetura }}.tar.gz"
          marcador: "linux-{{ arquitetura }}/helm"
        - url: "https://github.com/opentofu/opentofu/releases/download/v{{ versoes.opentofu }}/tofu_{{ versoes.opentofu }}_linux_{{ arquitetura }}.tar.gz"
          marcador: tofu
        - url: "https://github.com/FiloSottile/age/releases/download/{{ versoes.age }}/age-{{ versoes.age }}-linux-{{ arquitetura }}.tar.gz"
          marcador: age/age
        - url: "https://github.com/grafana/k6/releases/download/{{ versoes.k6 }}/k6-{{ versoes.k6 }}-linux-{{ arquitetura }}.tar.gz"
          marcador: "k6-{{ versoes.k6 }}-linux-{{ arquitetura }}/k6"
      loop_control:
        label: "{{ item.marcador }}"

    - name: Instalar binários extraídos
      ansible.builtin.copy:
        src: "/tmp/estacao-devops/{{ item }}"
        dest: "{{ destino_binarios }}/"
        remote_src: true
        mode: "0755"
      loop:
        - "linux-{{ arquitetura }}/helm"
        - tofu
        - age/age
        - age/age-keygen
        - "k6-{{ versoes.k6 }}-linux-{{ arquitetura }}/k6"

    - name: Instalar uv (gerenciador de projetos Python)
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR={{ destino_binarios }} sh
        executable: /bin/bash
        creates: "{{ destino_binarios }}/uv"

    - name: Conferir versões instaladas
      ansible.builtin.command: "{{ item }}"
      loop:
        - kubectl version --client
        - k3d version
        - helm version --short
        - tofu version
        - sops --version
        - kubectl-argo-rollouts version --short
        - cosign version
        - gh --version
      changed_when: false
