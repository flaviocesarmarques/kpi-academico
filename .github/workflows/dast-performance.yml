# =============================================================================
# Testes da aplicação EM EXECUÇÃO (etapa 8): DAST + carga + fumaça
# -----------------------------------------------------------------------------
# Sobe o ambiente completo com docker-compose (mesma imagem da produção) e:
#   1. Smoke test — a API responde e o painel funciona com dados reais.
#   2. DAST com OWASP ZAP — ataca a API "de fora", guiado pelo OpenAPI.
#   3. Teste de carga com k6 — falha se os SLOs (latência p95, erro) estourarem.
#
# Roda na main, toda noite e sob demanda (é mais demorado que o CI do PR).
# Relatórios ficam como artefatos do workflow (aba Actions → execução).
# =============================================================================
name: DAST e performance

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # todo dia às 02:23 (Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aplicacao-em-execucao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Subir ambiente (PostgreSQL + migrações + API)
        env:
          KPI_API_KEY: chave-somente-ci # valor descartável, existe só neste runner
        run: |
          docker compose up --build -d api
          docker compose run --rm seed
          timeout 60 bash -c 'until curl -fsS http://localhost:8000/health/ready; do sleep 2; done'

      - name: Smoke test
        run: |
          curl -fsS "http://localhost:8000/api/v1/cursos/CC/painel?periodo=2026.1" | \
            jq -e '.itens | length > 0'

      - name: DAST — OWASP ZAP (varredura de API via OpenAPI)
        # Regras e exceções justificadas em tests/zap/regras.tsv (WARN/FAIL/IGNORE).
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" \
            -v "$PWD/tests/zap/regras.tsv:/zap/regras.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap-api-scan.py \
            -t http://localhost:8000/openapi.json -f openapi \
            -c /zap/regras.tsv -r zap.html -J zap.json -I
        # -I: não falha por WARN; regras marcadas como FAIL no .tsv continuam bloqueando.

      - name: Carga — k6 (thresholds = SLOs; violação reprova o job)
        run: |
          docker run --rm --network host -v "$PWD/tests/carga:/scripts:ro" \
            -v "$PWD/reports:/reports" -e BASE_URL=http://localhost:8000 \
            grafana/k6:2.3.0 run --summary-export=/reports/k6.json /scripts/painel.js

      - name: Logs da aplicação (diagnóstico em caso de falha)
        if: failure()
        run: docker compose logs --no-color api migrate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorios-dast-carga
          path: reports/
          retention-days: 30
