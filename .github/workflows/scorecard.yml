# =============================================================================
# OpenSSF Scorecard — "nota" de segurança do PRÓPRIO repositório
# -----------------------------------------------------------------------------
# Avalia práticas como: branch protection, revisão de código, actions fixadas
# por SHA, permissões mínimas de token, Dependabot, SAST, política de segurança.
# Excelente "checklist vivo" das boas práticas desta trilha. Os achados aparecem
# em Security → Code scanning, e o selo pode ir para o README.
# Requer repositório PÚBLICO.
# =============================================================================
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 7 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analise:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write # publicar o resultado assinado (selo público)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
