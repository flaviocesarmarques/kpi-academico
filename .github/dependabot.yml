# =============================================================================
# Dependabot — atualização automática de dependências (etapa 3)
# -----------------------------------------------------------------------------
# Dependência desatualizada é vulnerabilidade esperando para acontecer.
# Atualizações pequenas e frequentes são mais seguras que "big bang" anual.
#   • Agrupamento: menos PRs, mais fáceis de revisar.
#   • Atualiza também os SHAs fixados das GitHub Actions e as imagens base.
#   • Alertas de segurança (CVE) abrem PRs imediatamente, fora do calendário.
# Alternativa mais configurável: Renovate (https://docs.renovatebot.com).
# =============================================================================
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      dependencias-dev:
        dependency-type: development
      dependencias-producao:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: terraform # funciona para provedores do OpenTofu
    directory: /infra/tofu
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(infra)"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
