# Postmortem SEM CULPA (blameless) — etapa 10 da trilha.
# Objetivo: aprender com o incidente e melhorar o SISTEMA, não apontar culpados.
# Preencha em até 5 dias úteis após o incidente; ações viram issues com dono e prazo.
name: Postmortem de incidente
description: Registro sem culpa de um incidente em produção
title: "postmortem: "
labels: [postmortem, incidente]
body:
  - type: textarea
    id: resumo
    attributes:
      label: Resumo
      description: O que aconteceu, em 2–3 frases, para quem não acompanhou.
    validations:
      required: true
  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: Quem foi afetado, por quanto tempo, quanto do SLO/error budget foi consumido.
    validations:
      required: true
  - type: textarea
    id: linha-do-tempo
    attributes:
      label: Linha do tempo (horário de Brasília)
      placeholder: |
        14:02 — deploy da v1.4.0 (canary 20%)
        14:05 — alerta KpiTaxaErroAlta disparou
        14:06 — Argo Rollouts abortou o canary automaticamente
    validations:
      required: true
  - type: textarea
    id: causa
    attributes:
      label: Causa raiz e fatores contribuintes
      description: Use os "5 porquês". Pergunte "o que no processo permitiu?", não "quem errou?".
  - type: textarea
    id: deteccao
    attributes:
      label: Como detectamos? Poderíamos ter detectado antes?
  - type: textarea
    id: funcionou
    attributes:
      label: O que funcionou bem
  - type: textarea
    id: acoes
    attributes:
      label: Ações corretivas (cada uma vira uma issue com dono e prazo)
      placeholder: |
        - [ ] Adicionar teste de regressão para ...
        - [ ] Criar alerta para ...
  - type: dropdown
    id: dora
    attributes:
      label: Foi causado por uma mudança (deploy)? — alimenta a métrica DORA "taxa de falha de mudança"
      options: ["Sim", "Não"]
